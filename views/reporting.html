<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Submitted Answers</title>
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="stylesheet" href="stylesheets/reporting.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <span><a href="/index">CIE²T</a></span>
        </div>
        <nav>
            <ul>
                <li><a href="/questionBank">Question Databank</a></li>
                <li><a href="/reporting">Assessment Reporting</a></li>
                <li><a href="/Exam_Automation">Exam Automation</a></li>
                <li><a href="/generatedPapers">Generated Papers</a></li>
            </ul>
        </nav>
        <div class="auth-buttons" id="auth-buttons">
            <span id="username" class="username"></span>
            <i class="fa-solid fa-arrow-right-from-bracket logout-icon" id="logout-btn" title="Logout"></i>
        </div>
    </header>

    <div class="container">
        <h1>Student Submitted Answers</h1>
        <table id="submitted-answers-table">
            <thead>
                <tr>
                    <th>Exam Code</th>
                    <th>Exam Name</th>
                    <!-- <th>User ID</th> -->
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Subject</th>
                    <th>Submitted At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be dynamically inserted here -->
            </tbody>
        </table>

        <!-- Modal for displaying student answers -->
        <div id="answers-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h2>Student Answers</h2>
                <table id="answers-table">
                    <thead>
                        <tr>
                            <th>Question Text</th>
                            <th>Question Type</th>
                            <th>Answer Text</th>
                            <th>Submitted At</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Answers will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    
    <script src="/scripts/reporting.js"></script>

    <style>
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }

        .close-btn {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            position: absolute;
            top: 10px;
            right: 25px;
        }

        .close-btn:hover,
        .close-btn:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</body>
</html>
