<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Report</title>
    <link rel="stylesheet" href="stylesheets/student-report.css" />
    <link rel="stylesheet" href="stylesheets/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <span><a href="/index">CIE²T</a></span>
      </div>
      <nav>
        <ul>
          <li><a href="/questionBank">Question Databank</a></li>
          <li><a href="/reporting">Assessment Reporting</a></li>
          <li><a href="/Exam_Automation">Exam Automation</a></li>
          <li><a href="/generatedPapers">Generated Papers</a></li>
        </ul>
      </nav>
      <div class="auth-buttons" id="auth-buttons">
        <span id="username" class="username"></span>
        <i
          class="fa-solid fa-arrow-right-from-bracket logout-icon"
          id="logout-btn"
          title="Logout"
        ></i>
      </div>
    </header>
  
<h1>Student Exam Report Subjective</h1>

<table id="answers-table">
  <thead>
    <tr>
      <th>Question Text</th>
      <th>Submitted Answer</th>
      <th>Correct Answer</th>
      <th>Question Type</th>
      <th>Score</th>
    </tr>
  </thead>
  <tbody>
    <!-- Answers will be dynamically inserted here -->
  </tbody>
</table>

<!-- New Section for Total Marks, Obtained Marks, Remarks, and Grade -->
<div id="report-summary">
  <h2>Exam Summary</h2>

  <div class="summary-item">
    <label for="totalMarks">Total Marks:</label>
    <span id="totalMarks">0</span> <!-- Will be dynamically updated -->
  </div>

  <div class="summary-item">
    <label for="obtainedMarks">Obtained Marks:</label>
    <span id="obtainedMarks">0</span> <!-- Will be dynamically updated -->
  </div>

  <div class="summary-item">
    <label for="remarks">Remarks: (Max 150 words)</label>
    <textarea id="remarks" rows="4" placeholder="Enter feedback..." required maxlength="750"></textarea>
  </div>

  <div class="summary-item">
    <label for="grade">Grade:</label>
    <span id="grade">--</span> <!-- Will be dynamically updated based on obtained marks -->
  </div>
</div>

<div id="submit">
  <button type="submit" id="submit-report">Submit Report</button>
</div>
    <!-- <div id="submit">
      <button type="submit" id="submit-report">Submit Report</button>
    </div> -->
    

    <script>
   async function fetchStudentAnswers() {
    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get("exam_id");
    const userId = urlParams.get("user_id");

    if (!examId || !userId) {
        alert("Missing exam or user ID");
        return;
    }

    try {
        const response = await fetch(`/api/student-answers/${examId}/${userId}`);
        if (!response.ok) throw new Error("Failed to fetch data");

        const data = await response.json();
        const tableBody = document.querySelector("#answers-table tbody");
        const totalMarksElement = document.querySelector("#totalMarks"); // Select the span for total marks
        const obtainedMarksElement = document.querySelector("#obtainedMarks"); // Select the span for obtained marks
        const gradeElement = document.querySelector("#grade"); // Select the span for grade

        tableBody.innerHTML = "";
        let totalMarks = 0;
        let obtainedMarks = 0;

        // Display total marks if available
        totalMarks = data[0]?.total_marks || 0; // Assuming all answers belong to the same exam
        totalMarksElement.textContent = totalMarks; // Update the totalMarks span

        data.forEach((answer, index) => {
            const row = `
                <tr>
                    <td>${answer.question_text}</td>
                    <td>${answer.answer_text}</td>
                    <td>${answer.correct_answer}</td>
                    <td>${answer.question_type}</td>
                    <td>
                        <input type="number" min="0" max="10" step="0.5" value="0" class="score-input" data-index="${index}">
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

        // Add event listeners to score inputs to update obtained marks and grade
        const scoreInputs = document.querySelectorAll('.score-input');
        scoreInputs.forEach(input => {
            input.addEventListener('input', () => {
                obtainedMarks = 0; // Reset obtained marks
                scoreInputs.forEach(input => {
                    obtainedMarks += parseFloat(input.value) || 0; // Sum the scores, defaulting to 0 if invalid input
                });
                obtainedMarksElement.textContent = obtainedMarks.toFixed(2); // Update obtained marks span with formatted value

                // Update grade based on the obtained marks
                const grade = calculateGrade(obtainedMarks, totalMarks);
                gradeElement.textContent = grade; // Update grade span with calculated grade
            });
        });

        // Submit Report Button Event Listener
        document.querySelector("#submit-report").addEventListener('click', async () => {
            const remarks = document.querySelector("#remarks").value; // Assuming there's an input for remarks
            const grade = gradeElement.textContent;
            const obtainedMarks = parseFloat(obtainedMarksElement.textContent);

            if (!remarks || grade === "--" || isNaN(obtainedMarks)) {
                alert("Please complete all fields before submitting.");
                return;
            }

            const reportData = {
                examId,
                userId,
                obtainedMarks,
                remarks,
                grade,
            };

            try {
                const response = await fetch('/api/save-student-report', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(reportData),
                });

                if (!response.ok) {
                    throw new Error("Failed to save report");
                }

                const result = await response.json();
                alert("Report submitted successfully!");
            } catch (error) {
                console.error("Error submitting report:", error);
                alert("An error occurred while submitting the report.");
            }
        });

    } catch (error) {
        console.error("Error fetching student answers:", error);
    }
}

// Function to calculate grade based on obtained marks
function calculateGrade(obtainedMarks, totalMarks) {
    const percentage = (obtainedMarks / totalMarks) * 100;
    if (percentage >= 90) return 'A+';
    if (percentage >= 85) return 'A';
    if (percentage >= 70) return 'B';
    if (percentage >= 60) return 'C';
    if (percentage >= 50) return 'D';
    return 'F';
}


      document.addEventListener("DOMContentLoaded", fetchStudentAnswers);
      document.addEventListener("DOMContentLoaded", () => {
        fetch("/api/user-info") // Endpoint to fetch the user's session info
          .then((response) => {
            if (!response.ok) {
              console.error("User not logged in");
              return;
            }
            return response.json();
          })
          .then((data) => {
            const user = data.user;
            const usernameSpan = document.getElementById("username");

            if (user && usernameSpan) {
              // Display user's first and last name
              usernameSpan.textContent = `${user.firstname} ${user.lastname}`;
            }
          })
          .catch((err) => {
            console.error("Failed to fetch user info:", err);
          });

        // Handle the logout button click
        const logoutButton = document.getElementById("logout-btn");
        if (logoutButton) {
          logoutButton.addEventListener("click", () => {
            fetch("/logout", {
              method: "POST",
            })
              .then((response) => response.json())
              .then((data) => {
                if (data.success) {
                  // Redirect to the homepage after successful logout
                  window.location.href = "/";
                } else {
                  console.error("Failed to log out");
                }
              })
              .catch((err) => {
                console.error("Error logging out:", err);
              });
          });
        }
      });
    </script>
  </body>
</html>
